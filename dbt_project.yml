
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_new_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Los bloques {% docs %} solo se buscan en esta carpeta. Un .md con docs
# blocks guardado en otro sitio (junto a un modelo, por ejemplo) no se
# encuentra y doc() falla con "doc not found".
docs-paths: ["docs"]

clean-targets: ["target", "dbt_packages"]

# =============================================================================
# Modelos · arquitectura Medallion Cívica
# =============================================================================
# Cada capa escribe en su database, que llega por variable de entorno
# (DBT_SILVER_DB, DBT_GOLD_DB): el mismo código sirve en desarrollo, DEV, PRE
# y PRO. Bronze no aparece aquí: dbt solo la lee con source().
# =============================================================================
models: 
  Data_eng_project_finance:
    +transient: false

    staging:
      +tags: ['staging']
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      source_oltp:
        +schema: source_oltp

    #Silver
    silver:
      +tags: ['silver']
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      source_oltp:
        +schema: source_oltp

    #Gold
    gold:
      +tags: ['gold']
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"

      intermediate:
        +materialized: view
        +schema: intermediate

      core:
        +tags: ['core']
        +schema: core
        +grants:
          select: ['REPORTING_ROLE']


seeds:
  Data_eng_project_finance:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    country_codes:
      # Tipos explícitos para que dbt no los infiera del CSV
      +column_types:
        country_code: varchar(2)
        country_name: varchar(100)
        continent: varchar(50)
    risk_profile:
      +column_types:
        risk_profile_code: int
        risk_profile: varchar(50)
        
    currencies:
      +column_types:
        